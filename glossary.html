    ['Feature list', '功能清单', 'eco', 'ch12', '用 JSON 记录的待实现功能及是否通过；后续会话只允许修改通过状态，用来防止过早宣布完成。'],
    ['Eval', '评测', 'eval', 'ch13', '用一组任务和评分规则衡量 agent 表现，是改提示词、换模型、拆组件之前的安全网。'],
    ['Task / Trial / Transcript / Outcome', '任务 / 试验 / 记录 / 结果', 'eval', 'ch13', '评测的基本术语：一个任务可多次试验，每次试验留下完整记录，并产生一个可评分的结果。'],
    ['Grader', '评分器', 'eval', 'ch13', '判定结果好坏的方法，分代码、模型、人工三类。能用确定性代码判的就用代码。'],
    ['LLM-as-judge', '模型判官', 'eval', 'ch13', '用模型按标准评分。建议每种失败模式一个二元判官，并用人工标注校准。'],
    ['TPR / TNR', '真阳性率 / 真阴性率', 'eval', 'ch13', '衡量模型判官与人工标注一致性的指标：真正失败的抓到多少，真正通过的放过多少。'],
    ['pass@k', 'pass@k', 'eval', 'ch13', 'k 次尝试中至少成功一次的概率，k 越大越高。'],
    ['pass^k', 'pass^k', 'eval', 'ch13', 'k 次尝试全部成功的概率，k 越大越低，反映稳定性。单次 75% 时 pass^3 约为 42%。'],
    ['Error analysis', '错误分析', 'eval', 'ch13', '读真实 trace、写自由笔记、归纳失败分类，再决定测什么、修什么。评测工作的第一步。'],
    ['Open / Axial coding', '开放编码 / 轴心编码', 'eval', 'ch13', '错误分析的两步：先对每条 trace 自由记录问题，再把笔记归并成失败类别。'],
    ['Capability vs. regression eval', '能力评测 / 回归评测', 'eval', 'ch13', '能力评测通过率起初应偏低、用来推动进步；回归评测应接近 100%、用来防止退化。'],
    ['Benchmark contamination', '基准污染', 'eval', 'ch13', '基准题目及答案进入了训练数据，分数不再反映真实能力。SWE-bench Verified 因此被停止报告。'],
    ['Trace / Span', '链路 / 跨度', 'eval', 'ch14', 'trace 记录一次完整运行，span 是其中一个步骤（一次模型调用、一次工具调用），可以嵌套。'],
    ['OTel GenAI semantic conventions', 'OTel 生成式 AI 语义约定', 'eval', 'ch14', 'OpenTelemetry 为模型与 agent 调用定义的 span 名称和属性（gen_ai.*），目前仍处于 Development 状态。'],
    ['TTFT (Time to first token)', '首 token 时间', 'eval', 'ch14', '从发出请求到收到第一个输出 token 的时间，决定交互"感觉快不快"。'],
    ['Model routing', '模型路由', 'eval', 'ch14', '按任务难度把请求分给不同模型，简单任务用便宜的模型。'],
    ['Model fallback', '模型回退', 'eval', 'ch14', '遇到认证、限流、服务端或网络错误时切换到备用模型；输出不符合格式不应触发回退。'],
    ['Budget cap', '预算上限', 'eval', 'ch14', '按日、按月限制花费，超限时降级运行而不是继续烧钱。'],
  ];

  const fileOf = Object.fromEntries(window.COURSE.parts.flatMap((p) => p.items).map((i) => [i.id, i.file]));
  const letterOf = (en) => { const c = en.trim()[0].toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
  const items = TERMS.map(([en, zh, cat, ch, desc]) => ({ en, zh, cat, ch, desc, letter: letterOf(en) }))
    .sort((a, b) => a.en.localeCompare(b.en, 'en', { sensitivity: 'base' }));

  const list = document.getElementById('g-list');
  const nodes = items.map((t) => {
    const no = Number(t.ch.slice(2));
    const node = Course.el('div', { class: 'term' });
    node.innerHTML =
      `<div class="term-head"><b>${Course.escape(t.zh)}</b><code>${Course.escape(t.en)}</code><span class="pill accent">${CATS[t.cat]}</span></div>` +
      `<p>${Course.escape(t.desc)} <a class="ch-link" href="${fileOf[t.ch]}">→ 第 ${no} 章</a></p>`;
    list.append(node);
    return { t, node, hay: (t.en + ' ' + t.zh + ' ' + t.desc).toLowerCase() };
  });

  let cat = null;
  let letter = null;
  const search = document.getElementById('g-search');
  const count = document.getElementById('g-count');
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    let n = 0;
    nodes.forEach(({ t, node, hay }) => {
      const show = (!q || q.split(/\s+/).every((w) => hay.includes(w))) && (!cat || t.cat === cat) && (!letter || t.letter === letter);
      node.style.display = show ? '' : 'none';
      if (show) n++;
    });
    count.textContent = n ? `显示 ${n} / ${nodes.length} 条` : '没有匹配的术语，换个关键词试试';
  };

  const makeChips = (box, entries, get, set) => {
    entries.forEach(([value, label]) => {
      const b = Course.el('button', { class: 'btn small', type: 'button', text: label });
      b.addEventListener('click', () => {
        set(get() === value ? null : value);
        [...box.children].forEach((x) => x.classList.remove('on'));
        if (get() === value) b.classList.add('on');
        apply();
      });
      box.append(b);
    });
  };
  makeChips(document.getElementById('g-cats'), Object.entries(CATS), () => cat, (v) => (cat = v));
  const letters = [...new Set(items.map((t) => t.letter))].sort();
  makeChips(document.getElementById('g-letters'), letters.map((l) => [l, l]), () => letter, (v) => (letter = v));
  search.addEventListener('input', apply);
  apply();
});
</script>
</body>
</html>
